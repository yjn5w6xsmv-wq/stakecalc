<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stake Calc">
  <title>Stake Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; font-family: -apple-system, 'SF Pro Display', sans-serif; padding: env(safe-area-inset-top,20px) 16px env(safe-area-inset-bottom,20px); min-height: 100vh; }
    .header { padding: 20px 4px 24px; }
    .header .sub { color: #f97316; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .header h1 { color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .header p  { color: #555; font-size: 14px; margin-top: 4px; }
    .card { background: #1a1a1a; border-radius: 20px; padding: 20px; border: 1px solid #252525; margin-bottom: 12px; }
    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    label { color: #666; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 10px; }
    input[type="number"] { width: 100%; background: #111; border: 1.5px solid #252525; border-radius: 12px; padding: 16px; color: #fff; font-size: 20px; font-family: -apple-system, sans-serif; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
    input[type="number"]:focus { border-color: #f97316; }
    input[type="number"]::placeholder { color: #2a2a2a; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .btn-row2 { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-row3 { display: flex; gap: 8px; margin-bottom: 8px; }
    .opt-btn { flex: 1; padding: 14px 4px; border-radius: 12px; border: 1.5px solid #252525; background: #111; color: #555; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; line-height: 1.4; -webkit-appearance: none; transition: all 0.15s; }
    .opt-btn.on       { border-color: #f97316; background: #f97316; color: #fff; }
    .opt-btn.on-long  { border-color: #22c55e; background: #22c55e; color: #fff; }
    .opt-btn.on-short { border-color: #ef4444; background: #ef4444; color: #fff; }
    .hint { color: #444; font-size: 12px; margin-top: 8px; min-height: 18px; }
    .divider { height: 1px; background: #222; margin: 16px 0; }
    .result-box { border-radius: 16px; padding: 22px 20px; text-align: center; margin-bottom: 12px; }
    .result-box.ok-long  { background: #111; border: 1.5px solid #22c55e; }
    .result-box.ok-short { background: #111; border: 1.5px solid #ef4444; }
    .result-box.capped   { background: #111; border: 1.5px solid #eab308; }
    .result-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; color: #666; }
    .result-number { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .ok-long  .result-number { color: #22c55e; }
    .ok-short .result-number { color: #ef4444; }
    .capped   .result-number { color: #eab308; }
    .result-sub { color: #555; font-size: 13px; margin-top: 6px; }
    .pips-box { background: #111; border: 1.5px solid #3b82f6; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .pips-label { color: #3b82f6; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .pips-sub   { color: #444; font-size: 12px; }
    .pips-num   { color: #3b82f6; font-size: 42px; font-weight: 800; line-height: 1; text-align: right; letter-spacing: -1px; }
    .pips-unit  { color: #444; font-size: 12px; text-align: right; margin-top: 2px; }
    .pnl-box { border-radius: 16px; padding: 22px 20px; text-align: center; margin-top: 8px; }
    .pnl-box.profit { background: #0a1a0a; border: 1.5px solid #22c55e; }
    .pnl-box.loss   { background: #1a0a0a; border: 1.5px solid #ef4444; }
    .pnl-lbl  { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; color: #555; }
    .pnl-num  { font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .pnl-box.profit .pnl-num { color: #22c55e; }
    .pnl-box.loss   .pnl-num { color: #ef4444; }
    .pnl-sub  { color: #555; font-size: 13px; margin-top: 6px; }
    .warning { background: #1c1600; border: 1.5px solid #eab308; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; font-size: 13px; color: #eab308; line-height: 1.6; }
    .bk-title { color: #333; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #222; }
    .bk-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #111; border-radius: 10px; margin-bottom: 6px; }
    .bk-lbl { color: #444; font-size: 14px; }
    .bk-val { color: #bbb; font-size: 14px; font-weight: 600; }
    .bk-val.warn { color: #eab308; }
    .empty { text-align: center; padding: 24px; color: #2a2a2a; font-size: 14px; }
    .clear-btn { width: 100%; padding: 18px; background: #111; border: 1.5px solid #252525; border-radius: 14px; color: #444; font-size: 15px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
    .clear-btn:active { background: #1a1a1a; color: #777; }
    .footer { text-align: center; color: #2a2a2a; font-size: 11px; padding: 16px 0 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="sub">Pepperstone cTrader</div>
    <h1>Stake Calculator</h1>
    <p>NAS100 · Spread betting</p>
  </div>
  <div class="card">
    <div class="field">
      <label>Direction</label>
      <div class="btn-row2" id="dir-btns">
        <button class="opt-btn on-long" data-val="long" onclick="pick('dir-btns',this);go()">▲  Long</button>
        <button class="opt-btn" data-val="short" onclick="pick('dir-btns',this);go()">▼  Short</button>
      </div>
    </div>
    <div class="field">
      <label for="capital">Total Capital (£)</label>
      <input type="number" inputmode="decimal" id="capital" placeholder="100000">
    </div>
    <div class="field">
      <label>Risk Per Trade</label>
      <div class="btn-row3" id="risk-btns">
        <button class="opt-btn on" data-val="1" onclick="pick('risk-btns',this);go()">1%</button>
        <button class="opt-btn" data-val="1.5" onclick="pick('risk-btns',this);go()">1.5%</button>
        <button class="opt-btn" data-val="2" onclick="pick('risk-btns',this);go()">2%</button>
      </div>
      <div class="hint" id="risk-hint"></div>
    </div>
    <div class="field">
      <label for="entry">Entry Price</label>
      <input type="number" inputmode="decimal" id="entry" placeholder="23728.7">
    </div>
    <div class="field">
      <label for="sl">Stop Loss Price</label>
      <input type="number" inputmode="decimal" id="sl" placeholder="23691">
    </div>
  </div>
  <div class="card" id="results-card">
    <div class="empty">Fill in entry and stop loss</div>
  </div>
  <div class="card">
    <div class="field">
      <label for="exit">Exit Price <span style="text-transform:none;letter-spacing:0;font-weight:400;font-size:10px">optional — P&L</span></label>
      <input type="number" inputmode="decimal" id="exit" placeholder="23800">
    </div>
    <div id="pnl-out"></div>
  </div>
  <div class="card">
    <div class="field">
      <label for="custom">Custom Stake <span style="text-transform:none;letter-spacing:0;font-weight:400;font-size:10px">optional — compare</span></label>
      <input type="number" inputmode="decimal" id="custom" placeholder="10.0" step="0.1">
    </div>
    <div id="cmp-out"></div>
  </div>
  <div class="card">
    <button class="clear-btn" onclick="clearAll()">Clear Fields</button>
  </div>
  <div class="footer">Pepperstone Spread Betting · NAS100 · 1:20</div>
<script>
  var LEV = 20, PIP = 1;
  function pick(gid, el) {
    document.getElementById(gid).querySelectorAll('.opt-btn').forEach(function(b) { b.classList.remove('on','on-long','on-short'); });
    if (gid === 'dir-btns') { el.classList.add(el.getAttribute('data-val') === 'long' ? 'on-long' : 'on-short'); } else { el.classList.add('on'); }
  }
  function active(gid) { return document.querySelector('#'+gid+' .on, #'+gid+' .on-long, #'+gid+' .on-short'); }
  function vals() {
    return { cap: parseFloat(document.getElementById('capital').value), en: parseFloat(document.getElementById('entry').value), sl: parseFloat(document.getElementById('sl').value), ex: parseFloat(document.getElementById('exit').value), cust: parseFloat(document.getElementById('custom').value), risk: active('risk-btns') ? parseFloat(active('risk-btns').getAttribute('data-val')) : 1, dir: active('dir-btns') ? active('dir-btns').getAttribute('data-val') : 'long' };
  }
  function stk(v) {
    var sd = Math.abs(v.en - v.sl), ra = v.cap * v.risk / 100, is = ra / sd, mps = v.en / LEV, mbm = v.cap / mps, cap = is > mbm, fs = Math.floor(Math.min(is, mbm) * 10) / 10;
    return { sd:sd, ra:ra, is:is, mps:mps, mbm:mbm, cap:cap, fs:fs };
  }
  function go() {
    var v = vals();
    document.getElementById('risk-hint').textContent = v.cap > 0 ? '= £' + (v.cap * v.risk / 100).toFixed(2) + ' at risk' : '';
    var rc = document.getElementById('results-card');
    if (!v.cap || !v.en || !v.sl || v.en === v.sl) { rc.innerHTML = '<div class="empty">Fill in entry and stop loss</div>'; return; }
    var s = stk(v), pips = (s.sd / PIP).toFixed(1), mr = s.fs * s.mps, isLong = v.dir === 'long', html = '';
    if (s.cap) html += '<div class="warning">Ideal stake ' + s.is.toFixed(2) + ' exceeds available margin. Capped to ' + s.fs.toFixed(1) + '.</div>';
    var boxClass = s.cap ? 'capped' : (isLong ? 'ok-long' : 'ok-short');
    var dirLabel = s.cap ? '⚠ Margin capped' : (isLong ? '▲ Long — enter in cTrader' : '▼ Short — enter in cTrader');
    html += '<div class="result-box ' + boxClass + '"><div class="result-label">' + dirLabel + '</div><div class="result-number">' + s.fs.toFixed(1) + '</div><div class="result-sub">Quantity (Stakes)</div></div>';
    html += '<div class="pips-box"><div><div class="pips-label">Stop loss distance</div><div class="pips-sub">Type into cTrader pips field</div></div><div><div class="pips-num">' + pips + '</div><div class="pips-unit">pips</div></div></div>';
    html += '<div class="bk-title">Breakdown</div>';
    [['Stop distance', s.sd.toFixed(2)+' pts', false],['Risk amount','£'+s.ra.toFixed(2),false],['Ideal stake',s.is.toFixed(2)+(s.cap?' (reduced)':''),s.cap],['Actual risk','£'+(s.fs*s.sd).toFixed(2),false],['Margin used','£'+mr.toFixed(2),false],['Margin free','£'+(v.cap-mr).toFixed(2),v.cap-mr<0]].forEach(function(r) { html += '<div class="bk-row"><span class="bk-lbl">'+r[0]+'</span><span class="bk-val'+(r[2]?' warn':'')+'">'+r[1]+'</span></div>'; });
    rc.innerHTML = html;
    pnl(v, s); cmp(v, s);
  }
  function pnl(v, s) {
    var out = document.getElementById('pnl-out');
    if (!v.ex || !v.en || !v.sl || v.en === v.sl || !v.cap) { out.innerHTML = ''; return; }
    var mv = v.dir === 'long' ? (v.ex - v.en) : (v.en - v.ex), pl = mv * s.fs, ok = pl >= 0, rr = Math.abs(pl / (s.fs * s.sd)).toFixed(2);
    out.innerHTML = '<div class="pnl-box '+(ok?'profit':'loss')+'"><div class="pnl-lbl">'+(ok?'Projected profit':'Projected loss')+'</div><div class="pnl-num">'+(ok?'+':'')+'£'+pl.toFixed(2)+'</div><div class="pnl-sub">'+Math.abs(mv).toFixed(2)+' pts · R:R '+rr+'R</div></div>';
  }
  function cmp(v, s) {
    var out = document.getElementById('cmp-out');
    if (!v.cust || !v.en || !v.sl || v.en === v.sl || !v.cap) { out.innerHTML = ''; return; }
    var cr = v.cust * s.sd, cp = (cr / v.cap * 100).toFixed(2), hasEx = !isNaN(v.ex) && v.ex > 0 && v.ex !== v.en;
    var mv = hasEx ? (v.dir === 'long' ? (v.ex - v.en) : (v.en - v.ex)) : null, cpl = mv !== null ? mv * v.cust : null;
    var html = '<div style="height:1px;background:#222;margin:12px 0"></div>';
    html += '<div class="bk-row"><span class="bk-lbl">Stake</span><span class="bk-val">'+v.cust.toFixed(1)+'</span></div>';
    html += '<div class="bk-row"><span class="bk-lbl">Risk</span><span class="bk-val'+(cr>s.ra?' warn':'')+'">£'+cr.toFixed(2)+' ('+cp+'%)</span></div>';
    if (cpl !== null) { var ok = cpl >= 0; html += '<div class="bk-row"><span class="bk-lbl">P&L</span><span class="bk-val" style="color:'+(ok?'#22c55e':'#ef4444')+'">'+(ok?'+':'')+'£'+cpl.toFixed(2)+'</span></div>'; }
    out.innerHTML = html;
  }
  function clearAll() {
    ['entry','sl','exit','custom'].forEach(function(id) { document.getElementById(id).value = ''; });
    document.getElementById('results-card').innerHTML = '<div class="empty">Fill in entry and stop loss</div>';
    document.getElementById('pnl-out').innerHTML = ''; document.getElementById('cmp-out').innerHTML = '';
    var v = vals(); document.getElementById('risk-hint').textContent = v.cap > 0 ? '= £'+(v.cap*v.risk/100).toFixed(2)+' at risk' : '';
  }
  ['capital','entry','sl','exit','custom'].forEach(function(id) { var el = document.getElementById(id); el.addEventListener('input', go); el.addEventListener('change', go); el.addEventListener('blur', go); });
</script>
</body>
</html>
